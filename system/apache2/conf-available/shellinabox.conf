<IfModule mod_proxy.c>

        ProxyRequests off
        <Location /admin/system/tools/terminal>
            ProxyPass http://127.0.0.1:64994/
            AuthType Basic
            AuthName "Loxberry Terminal"
            AuthUserFile ${LBHOMEDIR}/config/system/htusers.dat
            <RequireAny>
                Require valid-user
                Require local
            </RequireAny>
        </Location>

</IfModule>

