PREVIEW_DOCUMENT_PART4="\t\t\t\t\t\t<tr data-color-token=\"--lb-bg\"><td><span class=\"lb-preview-color-chip\"></span> Background</td><td>--lb-bg</td><td class=\"lb-preview-color-code\"></td></tr>\n"
PREVIEW_DOCUMENT_PART5="\t\t\t\t\t\t<tr data-color-token=\"--lb-primary\"><td><span class=\"lb-preview-color-chip\"></span> Primary</td><td>--lb-primary</td><td class=\"lb-preview-color-code\"></td></tr>\n\t\t\t\t\t\t<tr data-color-token=\"--lb-primary-hover\"><td><span class=\"lb-preview-color-chip\"></span> Primary hover</td><td>--lb-primary-hover</td><td class=\"lb-preview-color-code\"></td></tr>\n"
PREVIEW_DOCUMENT_PART6="\t\t\t\t\t\t<tr data-color-token=\"--lb-text-muted\"><td><span class=\"lb-preview-color-chip\"></span> Muted text</td><td>--lb-text-muted</td><td class=\"lb-preview-color-code\"></td></tr>\n\t\t\t\t\t\t<tr data-color-token=\"--lb-border-color\"><td><span class=\"lb-preview-color-chip\"></span> Default border</td><td>--lb-border-color</td><td class=\"lb-preview-color-code\"></td></tr>\n"
PREVIEW_DOCUMENT_PART7="\t\t\t\t\t\t<tr data-color-token=\"--lb-sidebar-text\"><td><span class=\"lb-preview-color-chip\"></span> Sidebar text</td><td>--lb-sidebar-text</td><td class=\"lb-preview-color-code\"></td></tr>\n\t\t\t\t\t\t<tr data-color-token=\"--lb-input-bg\"><td><span class=\"lb-preview-color-chip\"></span> Input</td><td>--lb-input-bg</td><td class=\"lb-preview-color-code\"></td></tr>\n"
PREVIEW_DOCUMENT_PART8="\t\t\t\t<div class=\"lb-section-title\">Form elements</div>\n"
PREVIEW_DOCUMENT_PART9="\t\t\t\t\t\t\t\t\t<input class=\"lb-input\" type=\"text\" id=\"text1\" placeholder=\"Enter text\" value=\"Demo\">\n\t\t\t\t\t\t\t\t\t<div class=\"lb-preview-help-text\">Core: <span class=\"lb-preview-code\">input.lb-input</span> for single-line text fields.</div>\n"
PREVIEW_DOCUMENT_PART10="\t\t\t\t\t\t\t\t\t<input class=\"lb-input\" type=\"text\" id=\"placeholder1\" placeholder=\"Placeholder text only\">\n\t\t\t\t\t\t\t\t\t<div class=\"lb-preview-help-text\">Core: <span class=\"lb-preview-code\">input.lb-input[placeholder]</span> uses <span class=\"lb-preview-code\">--lb-input-placeholder-text</span> and <span class=\"lb-preview-code\">--lb-input-placeholder-opacity</span>.</div>\n"
PREVIEW_DOCUMENT_PART11="\t\t\t\t\t\t\t\t\t<div class=\"lb-preview-help-text\">Core: <span class=\"lb-preview-code\">input.lb-input[type=time]</span> with <span class=\"lb-preview-code\">data-role=&quot;none&quot;</span> for the native browser time picker.</div>\n"
PREVIEW_DOCUMENT_PART12="\t\t\t\t\t\t\t\t\t<input class=\"lb-input\" type=\"text\" id=\"disabled1\" value=\"inactive\" disabled>\n\t\t\t\t\t\t\t\t\t<div class=\"lb-preview-help-text\">Core: <span class=\"lb-preview-code\">.lb-form-row.lb-disabled</span> dims a complete form row.</div>\n"
