PREVIEW_DOCUMENT_PART15="\t\t\t\t\t\t\t\t\t<div class=\"lb-preview-help-text\">Core: <span class=\"lb-preview-code\">select.lb-select</span> and <span class=\"lb-preview-code\">data-role=&quot;none&quot;</span> for a native dropdown.</div>\n"
