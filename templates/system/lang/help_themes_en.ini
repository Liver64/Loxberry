PREVIEW_DOCUMENT_PART0="\t\t\t\t<button type=\"button\" class=\"lb-header-btn lb-nav-toggle\" id=\"preview_nav_toggle\" title=\"Toggle navigation\"><i class=\"pi pi-bars\"></i></button>\n"
PREVIEW_DOCUMENT_PART1="\t\t\t\t<button type=\"button\" class=\"lb-header-btn headerbutton_blue\" id=\"preview_help_btn\" title=\"Help\"><i class=\"pi pi-question\"></i></button>\n"
PREVIEW_DOCUMENT_PART2="\t\t\t\t<h4>Color legend of the active theme</h4>\n\t\t\t\t<div class=\"lb-preview-muted\">The values are read live from the currently effective CSS tokens. This also shows available user themes correctly.</div>\n"
