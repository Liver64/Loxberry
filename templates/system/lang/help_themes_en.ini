WIKI_NEW_THEME_TITLE="Create a New Theme"
WIKI_NEW_THEME_INTRO="The Studio creates a suitable first draft from a single base color."
WIKI_NEW_THEME_STEP1="Open <strong>“New Theme”</strong> at the top left."
WIKI_NEW_THEME_STEP2="Choose a suitable <strong>base color</strong>."
WIKI_NEW_THEME_STEP3="Select <strong>Automatic</strong>, <strong>Light</strong>, or <strong>Dark</strong>."
WIKI_NEW_THEME_STEP4="Click <strong>“Apply color to theme”</strong>."
WIKI_NEW_THEME_STEP5="Review the draft in the preview and then save it."
WIKI_NEW_THEME_TIP="The first draft is only a starting point. Colors, borders, and corner shapes can all be adjusted afterwards."
WIKI_EDIT_TITLE="Edit an Element"
WIKI_EDIT_INTRO="Most changes begin by clicking the element you want to edit in the preview."
WIKI_EDIT_STEP1="Click the desired element in <strong>Workspace / Preview</strong>."
WIKI_EDIT_STEP2="Choose the property under <strong>“Selected element”</strong> on the left."
WIKI_EDIT_STEP3="Change the color, radius, or border width under <strong>“Settings”</strong>."
WIKI_EDIT_STEP4="Check the result immediately in the preview."
WIKI_EDIT_COLOR="Base Color"
WIKI_EDIT_TEXT="Text Color"
WIKI_EDIT_BORDER="Border"
WIKI_EDIT_HOVER="Hover"
WIKI_EDIT_RADIUS="Radius"
WIKI_EDIT_ADVANCED="Under “Show all affected tokens,” you can select a more specific assigned value when needed. This is not required for most changes."
WIKI_VALUES_TITLE="Adjust Colors and Shapes"
WIKI_VALUES_COLOR="Change colors using the preview swatches or the color picker."
WIKI_VALUES_RADIUS="Use “Radius” to make corners rounder or more square."
WIKI_VALUES_BORDER="Border width appears only for suitable elements."
WIKI_VALUES_UNDO="Use “Undo” to revert the most recent change."
WIKI_WALLPAPER_TITLE="Use a Wallpaper"
WIKI_WALLPAPER_STEP1="Click <strong>“Wallpaper”</strong> in the preview."
WIKI_WALLPAPER_STEP2="Enable wallpaper and choose an image file."
WIKI_WALLPAPER_STEP3="Adjust brightness and opacity."
WIKI_WALLPAPER_STEP4="Save the theme again afterwards."
WIKI_SAVE_TITLE="Save and Reload a Theme"
WIKI_SAVE_TEXT="“Save” turns your current draft into a usable user theme."
WIKI_SAVE_NAME="Enter a clear display name."
WIKI_SAVE_GENERATE="Choose “Save & generate CSS.”"
WIKI_SAVE_RELOAD="Saved themes appear in the theme selector at the top."
WIKI_SAVE_DELETE="Your own themes can be edited again or deleted later."
WIKI_PREVIEW_TITLE="Use Live Preview"
WIKI_PREVIEW_TEXT="The “Live Preview” tab shows a larger sample page using the current working state. It helps you see how forms, tables, and buttons work together."
WIKI_PREVIEW_TIP="Switch briefly between Design Studio and Live Preview before saving."
WIKI_LIQUID_GLASS_TITLE="Liquid Glass"
WIKI_LIQUID_GLASS_TEXT="Liquid Glass is a protected special theme. Its colors and controls are already coordinated and are not edited in the Studio."
WIKI_LIQUID_GLASS_HINT="You can still change the wallpaper, brightness, and opacity."
WIKI_CLASSIC_MAC_TITLE="Classic Mac"
WIKI_CLASSIC_MAC_TEXT="Classic Mac is a protected retro theme with its own font, fixed shapes, and classic colors."
WIKI_CLASSIC_MAC_HINT="It can be selected and used, but it cannot be edited or deleted in the Studio."
WIKI_CUSTOM_CSS_TITLE="Custom CSS and theme files"
WIKI_CUSTOM_CSS_INTRO="Import CSS or add rules for your theme. The following information describes the registry and system paths."
WIKI_CUSTOM_CSS_NAMING_TITLE="1. Filename and Theme ID"
WIKI_CUSTOM_CSS_NAMING_FILE="The filename must start with <code>theme-user-</code> and end in <code>.css</code>, for example <code>theme-user-my-theme.css</code>."
WIKI_CUSTOM_CSS_NAMING_ID="Registry ID, for example <code>user-example</code>; filename <code>theme-user-example.css</code>; CSS class <code>theme-user-example</code>."
WIKI_CUSTOM_CSS_NAMING_CHARS="Use lowercase letters a–z, digits, and hyphens only. Do not use spaces, umlauts, or special characters."
WIKI_CUSTOM_CSS_HEADER_TITLE="2. Comment Header"
WIKI_CUSTOM_CSS_HEADER_INFO="Document the display name, theme ID, version, and author in a comment at the beginning of the file."
WIKI_CUSTOM_CSS_HEADER_MARKER="Use the “CSS-Studio” marker only when the file was actually generated by Design Studio."
WIKI_CUSTOM_CSS_HEADER_ENCODING="Save the file as UTF-8 text without hidden formatting."
WIKI_CUSTOM_CSS_STRUCTURE_TITLE="3. Structure and CSS Rules"
WIKI_CUSTOM_CSS_STRUCTURE_SCOPE="Scope every token and additional rule to <code>body.theme-user-my-theme</code> or <code>.theme-user-my-theme</code>."
WIKI_CUSTOM_CSS_STRUCTURE_TOKENS="Use existing --lb design tokens. Define at least sensible values for background, text, primary color, borders, cards, buttons, inputs, and sidebar."
WIKI_CUSTOM_CSS_STRUCTURE_GLOBAL="Do not use unscoped global rules such as body, a, or *. They may alter other themes or plugin pages."
WIKI_CUSTOM_CSS_STRUCTURE_CONTRAST="Use light text tokens on dark surfaces and dark text tokens on light surfaces. Check hover, active, and disabled states as well."
WIKI_CUSTOM_CSS_INSTALL_TITLE="4. Install and Select"
WIKI_CUSTOM_CSS_INSTALL_PATH="CSS: <code>data/system/themes/theme-&lt;id&gt;.css</code>; registry: <code>config/system/themes/&lt;id&gt;.json</code>."
WIKI_CUSTOM_CSS_INSTALL_REFRESH="Reload the LoxBerry page completely afterwards. Clear the browser cache with Ctrl+F5 when needed."
WIKI_CUSTOM_CSS_INSTALL_SELECT="The new user theme should then appear under System Settings → My LoxBerry → Theme in the drop-down list."
WIKI_CUSTOM_CSS_INSTALL_JSON="Every theme requires a registry entry at config/system/themes/<id>.json containing id, name, type=\"user\", version and selectable=true, together with data/system/themes/theme-<id>.css. The Studio creates both files."
WIKI_CUSTOM_CSS_EXAMPLE_TITLE="Minimal Technically Valid Foundation"
WIKI_CUSTOM_CSS_CHECK_LABEL="Check before activation:"
WIKI_CUSTOM_CSS_CHECK_TEXT="The filename and scope match, important LoxBerry UI text remains readable, and no unscoped global selectors exist. Always create a backup before manual changes."
WIKI_FAQ_TITLE="Frequently Asked Questions"
WIKI_FAQ_MULTIPLE_QUESTION="Why do several elements sometimes change together?"
WIKI_FAQ_MULTIPLE_ANSWER="Some elements intentionally share basic settings so the theme remains consistent."
WIKI_FAQ_UNDO_QUESTION="How do I undo a change?"
WIKI_FAQ_UNDO_ANSWER="Click “Undo” at the top of the Studio to revert the latest change."
WIKI_FAQ_PROTECTED_QUESTION="Why are core themes absent from the Studio selection?"
WIKI_FAQ_PROTECTED_ANSWER="Core themes belong to the system and are neither listed nor edited in the Studio. The Studio creates and edits user themes only."
WIKI_FAQ_WALLPAPER_QUESTION="Where can I find the wallpaper editor?"
WIKI_FAQ_WALLPAPER_ANSWER="The “Wallpaper” button is located at the top right of Workspace / Preview."
WIKI_FAQ_ACTIVATE_THEME_QUESTION="How do I use my own theme?"
WIKI_FAQ_ACTIVATE_THEME_ANSWER="After saving your own theme, you can activate it for the entire LoxBerry system. Open System Settings → My LoxBerry → Theme and select your preferred theme from the drop-down list. Save your changes afterwards. The selected theme will then be used throughout the LoxBerry interface."
WIKI_FAQ_ACTIVATE_THEME_HINT="You can switch back to another theme or the default theme at any time."
