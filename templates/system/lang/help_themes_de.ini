PREVIEW_DOCUMENT_PART0="\t\t\t\t<button type=\"button\" class=\"lb-header-btn lb-nav-toggle\" id=\"preview_nav_toggle\" title=\"Navigation wechseln\"><i class=\"pi pi-bars\"></i></button>\n"
PREVIEW_DOCUMENT_PART1="\t\t\t\t<button type=\"button\" class=\"lb-header-btn headerbutton_blue\" id=\"preview_help_btn\" title=\"Hilfe\"><i class=\"pi pi-question\"></i></button>\n"
PREVIEW_DOCUMENT_PART2="\t\t\t\t<h4>Farb-Legende des aktiven Themes</h4>\n\t\t\t\t<div class=\"lb-preview-muted\">Die Werte werden live aus den aktuell wirksamen CSS-Tokens gelesen. Dadurch zeigt die Legende auch bereitgestellte User-Themes korrekt an.</div>\n"
PREVIEW_DOCUMENT_PART3="\t\t\t\t\t\t\t<th>Farbe</th>\n"
PREVIEW_DOCUMENT_PART4="\t\t\t\t\t\t<tr data-color-token=\"--lb-bg\"><td><span class=\"lb-preview-color-chip\"></span> Hintergrund</td><td>--lb-bg</td><td class=\"lb-preview-color-code\"></td></tr>\n"
PREVIEW_DOCUMENT_PART5="\t\t\t\t\t\t<tr data-color-token=\"--lb-primary\"><td><span class=\"lb-preview-color-chip\"></span> Primär</td><td>--lb-primary</td><td class=\"lb-preview-color-code\"></td></tr>\n\t\t\t\t\t\t<tr data-color-token=\"--lb-primary-hover\"><td><span class=\"lb-preview-color-chip\"></span> Primär Hover</td><td>--lb-primary-hover</td><td class=\"lb-preview-color-code\"></td></tr>\n"
PREVIEW_DOCUMENT_PART6="\t\t\t\t\t\t<tr data-color-token=\"--lb-text-muted\"><td><span class=\"lb-preview-color-chip\"></span> Text gedimmt</td><td>--lb-text-muted</td><td class=\"lb-preview-color-code\"></td></tr>\n\t\t\t\t\t\t<tr data-color-token=\"--lb-border-color\"><td><span class=\"lb-preview-color-chip\"></span> Standard-Rand</td><td>--lb-border-color</td><td class=\"lb-preview-color-code\"></td></tr>\n"
PREVIEW_DOCUMENT_PART7="\t\t\t\t\t\t<tr data-color-token=\"--lb-sidebar-text\"><td><span class=\"lb-preview-color-chip\"></span> Sidebar-Text</td><td>--lb-sidebar-text</td><td class=\"lb-preview-color-code\"></td></tr>\n\t\t\t\t\t\t<tr data-color-token=\"--lb-input-bg\"><td><span class=\"lb-preview-color-chip\"></span> Eingabe</td><td>--lb-input-bg</td><td class=\"lb-preview-color-code\"></td></tr>\n"
PREVIEW_DOCUMENT_PART8="\t\t\t\t<div class=\"lb-section-title\">Formular-Elemente</div>\n"
PREVIEW_DOCUMENT_PART9="\t\t\t\t\t\t\t\t\t<input class=\"lb-input\" type=\"text\" id=\"text1\" placeholder=\"Text eingeben\" value=\"Demo\">\n\t\t\t\t\t\t\t\t\t<div class=\"lb-preview-help-text\">Core: <span class=\"lb-preview-code\">input.lb-input</span> für einzeilige Textfelder.</div>\n"
PREVIEW_DOCUMENT_PART10="\t\t\t\t\t\t\t\t\t<input class=\"lb-input\" type=\"text\" id=\"placeholder1\" placeholder=\"Nur Platzhaltertext\">\n\t\t\t\t\t\t\t\t\t<div class=\"lb-preview-help-text\">Core: <span class=\"lb-preview-code\">input.lb-input[placeholder]</span> nutzt <span class=\"lb-preview-code\">--lb-input-placeholder-text</span> und <span class=\"lb-preview-code\">--lb-input-placeholder-opacity</span>.</div>\n"
PREVIEW_DOCUMENT_PART11="\t\t\t\t\t\t\t\t\t<div class=\"lb-preview-help-text\">Core: <span class=\"lb-preview-code\">input.lb-input[type=time]</span> mit <span class=\"lb-preview-code\">data-role=&quot;none&quot;</span> für nativen Browser-Timepicker.</div>\n"
PREVIEW_DOCUMENT_PART12="\t\t\t\t\t\t\t\t\t<input class=\"lb-input\" type=\"text\" id=\"disabled1\" value=\"inaktiv\" disabled>\n\t\t\t\t\t\t\t\t\t<div class=\"lb-preview-help-text\">Core: <span class=\"lb-preview-code\">.lb-form-row.lb-disabled</span> dimmt eine komplette Formularzeile.</div>\n"
PREVIEW_DOCUMENT_PART13="\t\t\t\t\t\t\t\t\t<input class=\"lb-input\" type=\"text\" id=\"disabled2\" value=\"nicht editierbar\" disabled>\n\t\t\t\t\t\t\t\t\t<div class=\"lb-preview-help-text\">Core: <span class=\"lb-preview-code\">input.lb-input[disabled]</span> nutzt die Disabled-Tokens der Input-Komponente.</div>\n"
