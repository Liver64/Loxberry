WIKI_CUSTOM_CSS_STRUCTURE_TITLE="3. Aufbau und CSS-Regeln"
WIKI_CUSTOM_CSS_STRUCTURE_SCOPE="Alle Tokens und Zusatzregeln auf <code>body.theme-user-mein-theme</code> beziehungsweise <code>.theme-user-mein-theme</code> begrenzen."
WIKI_CUSTOM_CSS_STRUCTURE_TOKENS="Vorhandene --lb-Design-Tokens verwenden. Mindestens Hintergrund, Text, Primärfarbe, Rahmen, Karten, Buttons, Eingaben und Sidebar sinnvoll definieren."
WIKI_CUSTOM_CSS_STRUCTURE_GLOBAL="Keine ungebundenen globalen Regeln wie body, a oder * verwenden. Sie könnten andere Themes oder Pluginseiten verändern."
WIKI_CUSTOM_CSS_STRUCTURE_CONTRAST="Bei dunklen Flächen helle Text-Tokens und bei hellen Flächen dunkle Text-Tokens setzen. Hover-, Aktiv- und Disabled-Zustände ebenfalls prüfen."
WIKI_CUSTOM_CSS_INSTALL_TITLE="4. Installieren und auswählen"
WIKI_CUSTOM_CSS_INSTALL_PATH="CSS: <code>data/system/themes/theme-&lt;id&gt;.css</code>; Registry: <code>config/system/themes/&lt;id&gt;.json</code>."
WIKI_CUSTOM_CSS_INSTALL_REFRESH="Danach die LoxBerry-Seite vollständig neu laden. Bei Bedarf den Browser-Cache mit Strg+F5 leeren."
WIKI_CUSTOM_CSS_INSTALL_SELECT="Unter Systemeinstellungen → Mein LoxBerry → Theme sollte das neue User Theme anschließend in der Dropdown-Liste erscheinen."
WIKI_CUSTOM_CSS_INSTALL_JSON="Jedes Theme benötigt einen Registry-Eintrag unter config/system/themes/<id>.json mit id, name, type=\"user\", version und selectable=true sowie die CSS-Datei data/system/themes/theme-<id>.css. Das Studio erstellt beide Dateien."
WIKI_CUSTOM_CSS_EXAMPLE_TITLE="Minimales, technisch gültiges Grundgerüst"
WIKI_CUSTOM_CSS_CHECK_LABEL="Vor dem Aktivieren prüfen:"
WIKI_CUSTOM_CSS_CHECK_TEXT="Dateiname und Scope stimmen überein, die wichtigsten LoxBerry-UI-Texte sind lesbar, und es existieren keine ungebundenen globalen Selektoren. Vor manuellen Änderungen immer eine Sicherung anlegen."
WIKI_FAQ_TITLE="Häufige Fragen"
WIKI_FAQ_MULTIPLE_QUESTION="Warum verändert sich manchmal mehr als ein Element?"
WIKI_FAQ_MULTIPLE_ANSWER="Einige Elemente teilen sich bewusst dieselben Grundeinstellungen, damit das Theme einheitlich bleibt."
WIKI_FAQ_UNDO_QUESTION="Wie nehme ich eine Änderung zurück?"
WIKI_FAQ_UNDO_ANSWER="Oben im Studio auf „Rückgängig“ klicken. Damit wird die letzte Änderung zurückgenommen."
WIKI_FAQ_PROTECTED_QUESTION="Warum fehlen die Core-Themes in der Studio-Auswahl?"
WIKI_FAQ_PROTECTED_ANSWER="Core-Themes gehören zum System und werden im Studio weder aufgelistet noch bearbeitet. Das Studio erstellt und bearbeitet ausschließlich User-Themes."
WIKI_FAQ_WALLPAPER_QUESTION="Wo finde ich den Wallpaper-Editor?"
WIKI_FAQ_WALLPAPER_ANSWER="Direkt oben rechts innerhalb des Arbeitsbereichs befindet sich der Button „Wallpaper“."
WIKI_FAQ_ACTIVATE_THEME_QUESTION="Wie nutze ich mein eigenes Theme?"
WIKI_FAQ_ACTIVATE_THEME_ANSWER="Nachdem du dein eigenes Theme gespeichert hast, kannst du es für ganz LoxBerry aktivieren. Öffne Systemeinstellungen → Mein LoxBerry → Theme und wähle dein gewünschtes Theme aus der Dropdown-Liste aus. Speichere anschließend die Änderung. Das ausgewählte Theme wird danach auf allen LoxBerry-Seiten verwendet."
WIKI_FAQ_ACTIVATE_THEME_HINT="Du kannst jederzeit wieder zu einem anderen Theme oder dem Standardtheme wechseln."
